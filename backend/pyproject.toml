[tool.poetry]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for Security Platform"
authors = ["Mehdi <mehdi@example.com>"]
packages = [
    { include = "app" },
]

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
fastapi = "0.95.2"
uvicorn = {extras = ["standard"], version = "0.22.0"}
neo4j = "5.13.0"
aiokafka = "0.8.1"
python-multipart = "0.0.6"
requests = "^2.31.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "4.0.1"
opensearch-py = "^2.4.1"
minio = "^7.2.0"

[tool.poetry.dev-dependencies]
pytest = "7.4.0"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"
